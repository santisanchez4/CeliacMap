name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest tests/ -q

  edge:
    name: Deno Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.4"
      - run: deno test --frozen --node-modules-dir=none --allow-read --allow-env=RESEND_BASE_URL,RESEND_USER_AGENT supabase/functions/

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.4"
      - run: deno test --frozen --node-modules-dir=none --allow-read tests/frontend_*.test.js

  required:
    name: CI required
    if: ${{ always() }}
    needs: [pytest, edge, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # A skipped or cancelled suite must never count as a passing gate.
      - name: Require every suite to pass
        env:
          PYTEST_RESULT: ${{ needs.pytest.result }}
          EDGE_RESULT: ${{ needs.edge.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          test "$PYTEST_RESULT" = success
          test "$EDGE_RESULT" = success
          test "$FRONTEND_RESULT" = success
