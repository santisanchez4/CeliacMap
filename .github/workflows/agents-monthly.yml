# Agents - monthly pipeline.
# Runs the CeliacMap agent pipeline (search -> validator -> updater) once per month.
# Manual runs (workflow_dispatch) can validate the pipeline first - the dry_run
# toggle gives a no-write rehearsal - before relying on the monthly cron.
name: Agents - monthly pipeline

on:
  schedule:
    # 09:00 UTC on the 1st of each month (~06:00 in Uruguay / Argentina).
    # Cron uses the default branch.
    - cron: '0 9 1 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run the pipeline without writing to the database"
        type: boolean
        default: false
      budget:
        description: "Override the combined daily budget (paid API calls); blank = default"
        type: string
        default: ""

permissions:
  contents: read

# Never let two pipeline runs overlap (they share one budget / database).
concurrency:
  group: agents-monthly
  cancel-in-progress: false

jobs:
  run-agents:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      OUTREACH_TEST_RECIPIENT: ${{ secrets.OUTREACH_TEST_RECIPIENT }}
      OUTREACH_SENDER_EMAIL: outreach@celiacmap.org
      OUTREACH_INBOUND_DOMAIN: celiacmap.org
      # Initial bounded volume per ADR-003, not the code default of 20.
      OUTREACH_MONTHLY_LIMIT: "3"
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Scheduled runs use the in-code default budget (AGENT_DAILY_BUDGET, 200).
      # Manual runs can override it via the "budget" input above.
      - name: Run pipeline
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ inputs.budget }}" ]; then ARGS="$ARGS --budget ${{ inputs.budget }}"; fi
          echo "Running: python -m scripts.run_agents $ARGS"
          python -m scripts.run_agents $ARGS
